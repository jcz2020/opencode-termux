name: build-deb

# tag 形如 v2.2.5+mirror1 → VERSION=2.2.5 REV=1（镜像线；源码线用 build-deb-source）
on:
  push:
    # 只认镜像线的 tag（v<ver>+mirror<N>），避免和源码线的 tag 抢同一个 release。
    # 注意：GitHub 的 glob 里 `+` 是特殊字符（前一个字符重复 ≥1 次），
    # 匹配字面量 `+` 必须转义。单引号里反斜杠原样保留，正好交给 GitHub。
    tags: ['v*\+mirror*']
  workflow_dispatch:
    inputs:
      version:
        description: '上游 opencode 版本（如 2.2.5）'
        required: true
        default: '2.2.5'
      rev:
        description: '本项目的修订号（mirror<N>）'
        required: true
        default: '1'
      publish:
        description: '构建后创建 release（workflow_dispatch 时生效）'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  NDK_VERSION: r27c
  ANDROID_API: 24

jobs:
  build:
    # tags 过滤器里已经限定镜像线；这里再兜一层，防止以后改触发条件时
    # 误让源码线的 tag（v<ver>+termux<N>）跑到镜像线打包。
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '+mirror') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve VERSION / REV / TAG
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            rev="${{ inputs.rev }}"
            tag="v${version}+mirror${rev}"
          else
            tag="${GITHUB_REF_NAME}"
            core="${tag#v}"                     # 2.2.5+mirror1
            version="${core%%+*}"               # 2.2.5
            rev="${core##*+mirror}"             # 1
          fi
          case "$tag" in
            v*+mirror*) ;;
            *) echo "ERROR: 镜像线 tag 必须形如 v<ver>+mirror<N>，收到: $tag" >&2; exit 1 ;;
          esac
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: version 形如 2.2.5，收到: $version" >&2; exit 1 ;;
          esac
          case "$rev" in
            '' | *[!0-9]*) echo "ERROR: rev 必须是数字，收到: $rev" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rev=$rev"         >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "VERSION=$version REV=$rev TAG=$tag"

      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Toolchain sanity
        run: |
          set -euo pipefail
          CC_SO="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          [ -x "$CC_SO" ] || { echo "missing $CC_SO"; ls "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/"; exit 1; }
          echo "CC=$CC_SO" >> "$GITHUB_ENV"
          "$CC_SO" --version | head -1
          dpkg-deb --version | head -1

      - name: Fetch upstream package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make fetch VERSION='${{ steps.v.outputs.version }}'

      - name: Build deb
        run: |
          set -euo pipefail
          REV='${{ steps.v.outputs.rev }}' make deb VERSION='${{ steps.v.outputs.version }}'
          ls -la dist/

      - name: Verify package
        run: |
          set -euo pipefail
          deb="$(ls dist/opencode_*_aarch64.deb)"
          dpkg-deb -I "$deb" | sed -n '1,14p'
          echo "--- payload"
          dpkg-deb -c "$deb"
          echo "--- shim 必须是 aarch64 / bionic"
          mkdir -p /tmp/x && dpkg-deb -x "$deb" /tmp/x
          file /tmp/x/data/data/com.termux/files/usr/lib/opencode/libnoheap.so
          file /tmp/x/data/data/com.termux/files/usr/bin/opencode.real
          echo "--- 16 KB page alignment"
          python3 scripts/check-16kb-pages.py \
            /tmp/x/data/data/com.termux/files/usr/bin/opencode.real \
            /tmp/x/data/data/com.termux/files/usr/lib/opencode/libnoheap.so \
            /tmp/x/data/data/com.termux/files/usr/lib/opencode/libopencode-crhandler.so
          # 相对文件名，用户可直接 sha256sum -c
          ( cd dist && sha256sum "$(basename "$deb")" | tee "$(basename "$deb").sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode_${{ steps.v.outputs.version }}+mirror${{ steps.v.outputs.rev }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.tar.zst
            dist/*.tar.zst.sha256
            dist/runtime-manifest.json
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          REV: ${{ steps.v.outputs.rev }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Termux/aarch64 的 opencode **${VERSION}** 重打包，带关堆 tagging shim。

          - 修 Android 11+（含 Android 16 / API 36）TUI 崩溃：
            \`Error: Pointer exceeds safe integer range\`
          - 包内布局：\`bin/opencode\`（wrapper）→ \`bin/opencode.real\`；
            shim 在 \`lib/opencode/\`
          - 二进制取自上游构建，来源与授权见仓库 \`NOTICE\`

          ## 安装

          \`\`\`sh
          pkg install -y xz-utils
          curl -LO https://github.com/${{ github.repository }}/releases/download/${TAG}/opencode_${VERSION}+mirror${REV}_aarch64.deb
          dpkg -i opencode_${VERSION}+mirror${REV}_aarch64.deb
          opencode --version
          \`\`\`

          没有 TUI 就说明 shim 没加载（\`dpkg -S \$PREFIX/lib/opencode/libnoheap.so\`）。
          EOF
          # 已存在就补传，避免重跑失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.deb.sha256 dist/*.tar.zst dist/*.tar.zst.sha256 dist/runtime-manifest.json --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.deb.sha256 dist/*.tar.zst dist/*.tar.zst.sha256 dist/runtime-manifest.json \
              --title "opencode ${VERSION}+mirror${REV} (镜像重打包)" \
              --notes-file notes.md
          fi
