name: build-deb-source

# 纯源码线打包：上游一发版，我们自己编 opencode + libopentui + bun-pty，然后打 deb。
# 不依赖任何第三方 Termux 打包产物。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '上游 opencode 版本（如 2.3.0，对应 tag v2.3.0）'
        required: true
        default: '2.3.0'
      rev:
        description: '本项目修订号（termux<N>，默认下一个未发布修订）'
        required: true
        default: '2'
      publish:
        description: '构建后创建 release'
        required: false
        default: 'true'
      allow_downgrade:
        description: '允许发布低于当前最高版本的旧版（强制标记为 latest=false）'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  NDK_VERSION: 'r27c'
  ZIG_VERSION: '0.17.0'
  BUN_RELEASE: 'bun-v1.4.4'
  API: '30'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (bun / zig / NDK / rust)
        run: |
          set -euo pipefail
          curl -sSL -o bun.zip "https://github.com/oven-sh/bun/releases/download/${BUN_RELEASE}/bun-linux-x64.zip"
          unzip -q bun.zip && echo "$PWD/bun-linux-x64" >> "$GITHUB_PATH"
          curl -sSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz && echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip && echo "NDK_ROOT=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          export PATH="$PWD/bun-linux-x64:$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
          bun --version; zig version; rustc --version

      - name: Build deb from source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$PWD/bun-linux-x64:$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
          bash scripts/build-source-deb.sh '${{ inputs.version }}' '${{ inputs.rev }}'

      - name: Static smoke (no device needed)
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          CORE=$(find build -type d -path '*/node_modules/@opentui/core' | head -1)
          PTY=$(find build -type d -path '*/node_modules/bun-pty' | head -1)
          bash scripts/smoke-static.sh "$deb" "$CORE" "$PTY"

      - name: Summary
        run: |
          {
            echo "### 源码线打包"
            echo ""
            echo '```'
            ls -la dist/
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-source-${{ inputs.version }}+termux${{ inputs.rev }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.tar.zst
            dist/*.tar.zst.sha256
            dist/runtime-manifest.json
          retention-days: 30

      - name: Publish release
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REV: ${{ inputs.rev }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}+termux${REV}"

          # 获取已发布的源码线版本列表，计算最高已发版本
          ours=$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)
          highest_ver=$(grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+\+termux[0-9]+$' <<<"$ours" \
            | sed -E 's/^v([0-9.]+)\+termux[0-9]+$/\1/' | sort -V | tail -1 || true)

          is_latest=false
          if [ -z "$highest_ver" ]; then
            is_latest=true
          else
            cmp=$(printf '%s\n%s\n' "$highest_ver" "$VERSION" | sort -V | tail -1)
            if [ "$cmp" = "$VERSION" ]; then
              # VERSION >= highest_ver
              is_latest=true
            else
              if [ "$ALLOW_DOWNGRADE" != "true" ]; then
                echo "ERROR: 试图发布旧版本 $VERSION，而当前已有更高版本 $highest_ver。" >&2
                echo "       若确定要构建旧版本分支，请在 workflow_dispatch 中设置 allow_downgrade=true。" >&2
                exit 1
              fi
              echo "WARN: 允许发布旧版本 $VERSION（当前最高版本为 $highest_ver），此 Release 将显式标记为 latest=false。"
              is_latest=false
            fi
          fi

          cat > notes.md <<EOF
          Termux/aarch64 的 opencode **${VERSION}**，**全部从源码编译**（bionic）。

          - opencode 本体：官方 Android Bun (\`${BUN_RELEASE}\`) + \`--target=bun-linux-aarch64-android\`
          - \`libopentui.so\`：zig 编核心 + NDK clang++ 编 yoga，静态链 libc++
          - \`librust_pty.so\`：cargo + NDK clang 交叉编（bun-pty）
          - \`libnoheap.so\`：关 bionic 堆 tagging（Android 11+ TUI 必需）
          - 运行时 bundle 内置 \`git\` 2.56.1（含 HTTPS helper）与 \`ripgrep\` 15.2.0
          - 所有 ELF 的 PT_LOAD 均按 16 KB 页对齐，兼容 Android 15/16
          - 嵌入 Web UI 资产，支持 \`opencode serve\` 离线 Web 界面与 WebView

          不依赖任何第三方 Termux 打包产物。

          ## 一键安装 / 更新（国内自动加速）

          \`\`\`sh
          curl -fsSL https://ghfast.top/https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-termux.sh | bash
          \`\`\`

          ## 手动安装

          \`\`\`sh
          curl -LO https://github.com/${{ github.repository }}/releases/download/${TAG}/opencode_${VERSION}+termux${REV}_aarch64.deb
          dpkg -i opencode_${VERSION}+termux${REV}_aarch64.deb
          opencode --version
          \`\`\`

          ## 独立运行时 Bundle（Android App 消费）

          - \`runtime-${VERSION}+termux${REV}-aarch64.tar.zst\`
          - \`runtime-manifest.json\`
          EOF

          latest_flag="--latest=false"
          if [ "$is_latest" = "true" ]; then
            latest_flag="--latest"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新资产..."
            gh release upload "$TAG" dist/*.deb dist/*.deb.sha256 dist/*.tar.zst dist/*.tar.zst.sha256 dist/runtime-manifest.json --clobber
            if [ "$is_latest" = "true" ]; then
              gh release edit "$TAG" --latest
            else
              gh release edit "$TAG" --latest=false
            fi
          else
            gh release create "$TAG" dist/*.deb dist/*.deb.sha256 dist/*.tar.zst dist/*.tar.zst.sha256 dist/runtime-manifest.json \
              --title "opencode ${VERSION}+termux${REV} (源码构建)" \
              --notes-file notes.md \
              $latest_flag
          fi
