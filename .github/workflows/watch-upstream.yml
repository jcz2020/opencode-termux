name: watch-upstream

# 盯上游 opencode 的 release（tag 形如 v2.2.6），一有新版本就自动跟进：
#   1) Hope2333 的 bionic 资产已出 → 建 tag（v<ver>+termux<N>），触发 build-deb 出包并发布
#   2) 还没有 → 开 issue + 触发源码线 spike 编译（先把产物备好）
#
# 状态判断全部基于"我们自己的 release tag"，所以重复跑是幂等的。

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时
  workflow_dispatch:
    inputs:
      force_version:
        description: '强制按某个上游版本跑一次（调试用，如 2.2.5）'
        required: false
        default: ''
      dry_run:
        description: '只打印判断结果，不做任何写操作'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  actions: write

env:
  UPSTREAM: anomalyco/opencode
  REPO: ${{ github.repository }}
  MIRROR: Hope2333/opencode-termux

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve upstream latest version
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          forced='${{ inputs.force_version }}'
          if [ -n "$forced" ]; then
            ver="$forced"; src="forced"
          else
            # 注意：releases/latest 指向 v1 维护线（1.19.5），我们要 v2 主线，
            # 所以拉一批 release 自己比 semver。
            ver=$(gh api "repos/$UPSTREAM/releases?per_page=100" --jq '[.[].tag_name]
              | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
              | map(ltrimstr("v")) | sort_by(split(".") | map(tonumber)) | last')
            src="upstream";
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "source=$src" >> "$GITHUB_OUTPUT"
          echo "上游最新: $ver ($src)"

      - name: Are we already tracking it?
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          ours=$(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' || true)
          echo "$ours" | sed 's/^/  已有: /'
          # 只跟"比我们已发的更新"的版本（上游 v1 维护线比 v2 小，避免误跟进）
          latest_ours=$(grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+\+termux[0-9]+$' <<<"$ours" \
            | sed -E 's/^v([0-9.]+)\+termux[0-9]+$/\1/' | sort -V | tail -1 || true)
          if [ -n "$latest_ours" ] && [ "$(printf '%s\n%s\n' "$latest_ours" "$VER" | sort -V | tail -1)" != "$VER" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "上游 $VER 不高于我们已发的 $latest_ours，跳过"
          elif grep -qE "^v${VER}\+termux[0-9]+$" <<<"$ours"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "已经发过 $VER，跳过"
          else
            rev=$( (grep -oE "^v${VER}\+termux([0-9]+)$" <<<"$ours" | sed -E 's/.*termux([0-9]+)$/\1/' | sort -n | tail -1) || true)
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "rev=${rev:-1}" >> "$GITHUB_OUTPUT"
            echo "新版本: $VER（下一个 termux 修订号 ${rev:-1}）"
          fi

      - name: Dispatch source build + release
        if: steps.state.outputs.new == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.up.outputs.version }}
          REV: ${{ steps.state.outputs.rev }}
        run: |
          set -euo pipefail
          # 纯源码线：opencode + libopentui + librust_pty 全自己编，不再看第三方资产。
          # （API 建 tag 不会触发 push 事件，所以用 dispatch。）
          gh workflow run build-deb-source --repo "$REPO" --ref main \
            -f version="$VER" -f rev="$REV" -f publish=true
          echo "已触发 build-deb-source v${VER}+termux${REV}（publish=true）"

      - name: Summary
        run: |
          {
            echo "### watch-upstream"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游最新 | \`${{ steps.up.outputs.version }}\` (${{ steps.up.outputs.source }}) |"
            echo "| 是否已跟进 | ${{ steps.state.outputs.new == 'true' && '否 → 已处理' || '是，跳过' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
