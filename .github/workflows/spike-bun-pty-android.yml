name: spike-bun-pty-android

# `bun-pty` 是 opencode 跑命令/终端面板的原生依赖（Rust cdylib，靠 bun:ffi dlopen）。
# npm 上只有 glibc/musl 的 .so，bionic 加载不了（libc.so.6 not found）。
# 这里用官方 NDK toolchain 交叉编 aarch64-linux-android 版本，产物带回设备验证。

on:
  workflow_dispatch:
    inputs:
      bun_pty_ref:
        description: 'bun-pty tag/branch/commit'
        required: true
        default: 'v0.4.11'
      api:
        description: 'Android API level'
        required: true
        default: '30'

permissions:
  contents: read

env:
  NDK_VERSION: 'r27c'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "NDK_ROOT=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install rust + android target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          rustc --version; cargo --version

      - name: Fetch bun-pty source
        run: |
          set -euo pipefail
          ref='${{ inputs.bun_pty_ref }}'
          curl -sSL -o bp.tar.gz "https://codeload.github.com/sursaone/bun-pty/tar.gz/refs/tags/${ref}" \
            || curl -sSL -o bp.tar.gz "https://codeload.github.com/sursaone/bun-pty/tar.gz/${ref}"
          mkdir -p bp && tar -xf bp.tar.gz -C bp --strip-components=1
          ls bp/rust-pty

      - name: Build librust_pty for aarch64-linux-android
        env:
          API: ${{ inputs.api }}
        run: |
          set -euo pipefail
          CLANG="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          [ -x "$CLANG" ] || { echo "no $CLANG"; exit 1; }
          cd bp/rust-pty
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC_aarch64_linux_android="$CLANG"
          export AR_aarch64_linux_android="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          # Android 没有 libutil；openpty/forkpty/ptsname 都在 libc 里，NDK stub 已提供
          cargo build --release --target aarch64-linux-android --offline 2>/dev/null \
            || cargo build --release --target aarch64-linux-android
          ls -la target/aarch64-linux-android/release/*.so

      - name: Verify
        run: |
          set -euo pipefail
          SO=$(ls bp/rust-pty/target/aarch64-linux-android/release/librust_pty.so)
          file "$SO"
          echo "size: $(stat -c%s "$SO") bytes"
          echo "--- NEEDED"
          readelf -d "$SO" | grep -E 'NEEDED|SONAME' || true
          echo "--- 未解析的 libc 专属符号（应为空）"
          readelf --dyn-syms -W "$SO" | awk '$7=="UND" {print $8}' | sort -u | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: librust_pty-android-${{ inputs.api }}
          path: bp/rust-pty/target/aarch64-linux-android/release/librust_pty.so
          retention-days: 14
